name: Build and publish images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/konghack/php

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.php }},enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1,prefix=${{ matrix.php }}-,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr,prefix=${{ matrix.php }}-
          labels: |
            org.opencontainers.image.title=KongHack PHP ${{ matrix.php }}
            org.opencontainers.image.description=KongHack PHP ${{ matrix.php }} FPM base image
            org.opencontainers.image.licenses=MIT

      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: php-${{ matrix.php }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
          provenance: mode=max
          sbom: true
