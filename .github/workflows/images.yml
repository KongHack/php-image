name: Build and publish images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/konghack/php

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"

          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::VERSION contains '$version', but the Git tag is '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.php }},enable={{is_default_branch}}
            type=semver,pattern={{version}},prefix=${{ matrix.php }}-
            type=ref,event=pr,prefix=${{ matrix.php }}-
          labels: |
            org.opencontainers.image.title=KongHack PHP ${{ matrix.php }}
            org.opencontainers.image.description=KongHack PHP ${{ matrix.php }} FPM base image
            org.opencontainers.image.licenses=MIT

      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: php-${{ matrix.php }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Extract release notes
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"

          awk -v version="$GITHUB_REF_NAME" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::No release notes found for $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
